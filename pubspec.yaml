name: daoapp
description: "스틸리그 포인트 집계 앱 - 관리자 전용 입력 + 실시간 랭킹 + 경기 일정"
publish_to: 'none'

version: 1.1.5+16

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_app_badger: ^1.5.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  rxdart: ^0.27.7
  firebase_storage: ^12.3.4
  cloud_functions: ^5.6.2
  cached_network_image: ^3.3.1
  flutter_riverpod: ^2.4.0
  provider: ^6.1.1
  get_it: ^8.0.1
  table_calendar: ^3.1.2
  carousel_slider: ^5.0.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  url_launcher: ^6.2.6
  google_sign_in: ^6.2.1
  collection: ^1.17.0
  firebase_database: ^11.3.10
  share_plus: ^7.2.2
  firebase_app_check: ^0.3.0+2
  path: ^1.8.3
  fl_chart: ^0.69.0
  scrollable_positioned_list: ^0.3.8
  google_mobile_ads: ^5.1.0

  # 아레나 토너먼트 기능 완벽 지원
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # 반드시 추가! (우리가 만든 모든 화려한 효과들)
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.1
  json_serializable: ^6.8.0

  # ✅ 앱 아이콘 생성용 (dev_dependencies에 두는 게 정석)
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900

  assets:
    - assets/fonts/
    - assets/images/app_icon.png
    - assets/images/logo_dao.png
    - assets/images/splash_portrait.png
    - assets/images/login_background.png
    - assets/images/google_logo.png
    - assets/images/dartboard.png

    # ✅ 커뮤니티 기본 이미지(글-only 게시물, 프리뷰 배경 등)
    - assets/images/circle_main.png

    # ✅ 새 아이콘 리소스(배경/로고 분리)
    - assets/images/ic_launcher_background.png
    - assets/images/ic_launcher_foreground.png

    - assets/badges/pro.png
    - assets/badges/emerald.png
    - assets/badges/diamond.png
    - assets/badges/platinum1.png
    - assets/badges/platinum2.png
    - assets/badges/gold1.png
    - assets/badges/gold2.png
    - assets/badges/silver1.png
    - assets/badges/silver2.png
    - assets/badges/bronze1.png
    - assets/badges/bronze2.png
    - assets/badges/bronze3.png
    - assets/badges/tro.png
    - assets/badges/season.png
    - assets/badges/season1.png
    - assets/badges/season2.png
    - assets/badges/season3.png

# ✅ Adaptive Icon 설정 (이게 핵심)
flutter_launcher_icons:
  android: true
  ios: true

  # iOS는 단일 이미지 기반이라 app_icon.png를 계속 써도 되고,
  # 필요하면 나중에 iOS용도 따로 만들어도 됨.
  image_path: "assets/images/app_icon.png"

  min_sdk_android: 21

  # ✅ Android Adaptive Icon: 배경/로고 분리 파일 사용
  adaptive_icon_background: "assets/images/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/images/ic_launcher_foreground.png"
