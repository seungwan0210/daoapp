name: daoapp
description: "스틸리그 포인트 집계 앱 - 관리자 전용 입력 + 실시간 랭킹 + 경기 일정"
publish_to: 'none'

version: 1.3.8+40

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_app_badger: ^1.5.0

  # ==== Firebase Core & 관련 패키지 ====
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  cloud_functions: ^6.2.0
  firebase_database: ^12.3.0
  firebase_app_check: ^0.4.3
  easy_date_timeline: ^2.0.9

  # ==== 상태관리 / 유틸 ====
  flutter_riverpod: ^2.4.0
  provider: ^6.1.1
  get_it: ^9.2.1
  rxdart: ^0.28.0
  collection: ^1.17.0
  path: ^1.8.3
  intl: ^0.20.2

  # ==== UI / 위젯 ====
  table_calendar: ^3.1.2
  carousel_slider: ^5.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.2.1
  flutter_linkify: ^6.0.0
  url_launcher: ^6.2.6
  fl_chart: ^1.2.0
  scrollable_positioned_list: ^0.3.8
  share_plus: ^12.0.2
  app_links: ^6.0.1

  # ==== 광고 / 로그인 ====
  google_mobile_ads: ^7.0.0
  google_sign_in: 6.2.1
  sign_in_with_apple: ^7.0.1

  # ==== 아레나 토너먼트 & 모델 ====
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ==== 이펙트 / 미디어 ====
  confetti: ^0.8.0
  video_player: ^2.10.1
  chewie: ^1.13.0

  # ==== ML / Export ====
  google_mlkit_pose_detection: ^0.14.0
  gal: ^2.3.2
  ffmpeg_kit_flutter_new: ^4.1.0

  # ==== 카메라 / 권한 ====
  camera: ^0.12.0+1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

  # ✅ 앱 아이콘 생성용
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900

  assets:
    - assets/fonts/

    # ==== 공통 이미지 ====
    - assets/images/app_icon.png
    - assets/images/logo_dao.png
    - assets/images/splash_portrait.png
    - assets/images/login_background.png
    - assets/images/google_logo.png
    - assets/images/dartboard.png
    - assets/images/circle_main.png

    # ✅ 포즈 분석 가이드 이미지 (기존)
    - assets/images/guide_good.png
    - assets/images/guide_bad.png

    # ✅ 그립 분석 가이드 이미지 (새로 추가됨)
    - assets/images/grip_guide_good.png
    - assets/images/grip_guide_bad.png

    # ==== Android Adaptive Icon 리소스 ====
    - assets/images/ic_launcher_background.png
    - assets/images/ic_launcher_foreground.png

    # ==== 뱃지 이미지 ====
    - assets/badges/pro.png
    - assets/badges/emerald.png
    - assets/badges/diamond.png
    - assets/badges/platinum1.png
    - assets/badges/platinum2.png
    - assets/badges/gold1.png
    - assets/badges/gold2.png
    - assets/badges/silver1.png
    - assets/badges/silver2.png
    - assets/badges/bronze1.png
    - assets/badges/bronze2.png
    - assets/badges/bronze3.png
    - assets/badges/tro.png
    - assets/badges/season.png
    - assets/badges/season1.png
    - assets/badges/season2.png
    - assets/badges/season3.png

# ✅ 앱 아이콘 설정
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/app_icon.png"

  min_sdk_android: 21

  adaptive_icon_background: "assets/images/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/images/ic_launcher_foreground.png"
