<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAO Darts - 다트의 모든 것</title>
  <style>
    body {
        font-family: 'Pretendard', sans-serif;
        text-align: center;
        padding: 0;
        margin: 0;
        background-color: #0F172A; /* 승완님 앱 테마에 맞춘 어두운 색 */
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100vh;
    }
    .container { padding: 20px; }
    h1 { font-size: 2.5rem; color: #FACC15; margin-bottom: 10px; } /* 노란색 포인트 */
    p { font-size: 1.1rem; color: #CBD5E1; line-height: 1.6; margin-bottom: 30px; }
    .logo { width: 120px; margin-bottom: 20px; }
    .btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
    .btn {
        display: inline-block;
        width: 250px;
        padding: 15px 0;
        background-color: #FACC15;
        color: #0F172A;
        text-decoration: none;
        border-radius: 12px;
        font-weight: bold;
        font-size: 1rem;
        transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn.ios { background-color: #FFFFFF; color: #000000; }
    .footer { margin-top: 50px; font-size: 0.8rem; color: #64748B; }
  </style>
</head>
<body>
<div class="container">
  <div style="font-size: 60px; margin-bottom: 20px;">🎯</div>
  <h1>DAO Darts</h1>
  <p>대한민국 다트의 기준<br>실시간 랭킹과 대회 정보를 앱에서 확인하세요!</p>

  <div class="btn-group">
    <a href="https://play.google.com/store/apps/details?id=kr.comong.daoapp" class="btn">
      Google Play에서 설치
    </a>
    <a href="https://apps.apple.com/app/id6757020157" class="btn ios">
      App Store에서 설치
    </a>
  </div>

  <div class="footer">
    © 2026 Professional Darts Korea Co., Ltd.
  </div>
</div>

<script>
  // 페이지 로드 시 앱이 있으면 실행을 시도해볼 수 있지만,
  // 보통은 App Links/Universal Links가 우선적으로 처리하므로 버튼 위주로 구성했습니다.
</script>
</body>
</html>
